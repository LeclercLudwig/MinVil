name: Mod Fabric

on:
  push:
    branches: [main, "ccr-*"]
    paths: ["mod/**", "prototype/**", ".github/workflows/mod.yml"]
  pull_request:
    paths: ["mod/**", "prototype/**", ".github/workflows/mod.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Tests du prototype
        working-directory: prototype
        run: |
          python3 -I mystery.py
          python3 -I export.py --test

      - name: Enquêtes embarquées à jour
        run: |
          python3 -I prototype/export.py $(seq 0 99) --dir mod/src/main/resources/minvil/enquetes > /dev/null
          git diff --stat --exit-code -- mod/src/main/resources/minvil/enquetes

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Compiler et tester le mod
        working-directory: mod
        run: ./gradlew build --stacktrace

      - name: Diagnostic (noms des classes de Minecraft)
        if: failure()
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches mod/.gradle -name '*.jar' -size +10M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/entity/EntityType.class'; then JAR="$j"; break; fi
          done
          echo "Jar de Minecraft : ${JAR:-introuvable}"
          if [ -n "$JAR" ]; then
            CLASSES=$(unzip -l "$JAR" | awk '{print $4}' | grep -E '/(Villager|VillagerData|VillagerProfession|Entity|EntityType|EntitySpawnReason|CommandSourceStack|Commands|SharedSuggestionProvider|InteractionResult|InteractionHand|Identifier|ResourceKey|Registries|ServerLevel|MinecraftServer|Player|Mob|Component|ChatFormatting)\.class$')
            echo "$CLASSES"
            for c in $CLASSES; do
              echo "=== ${c%.class}"
              javap -cp "$JAR" -public "${c%.class}" | grep -E 'snapTo|moveTo|addTag|getTags|discard|create\(|withProfession|setVillagerData|getVillagerData|sendSuccess|sendFailure|displayClientMessage|sendSystemMessage|getAllEntities|getAllLevels|lookupOrThrow|setNoAi|setPersistenceRequired|setCustomName|isClientSide|getGameTime|level\(|suggest\(|literal\(|parse\(|SUCCESS|PASS' | head -40
            done
          fi
          echo "=== Classes Fabric API"
          for j in $(find ~/.gradle/caches -name 'fabric-*.jar' 2>/dev/null); do
            unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -E 'CommandRegistrationCallback|UseEntityCallback' | sed "s|^|$(basename $j): |"
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: minvil-mod
          path: mod/build/libs/minvil-*.jar
          if-no-files-found: error
