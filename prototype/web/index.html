<title>Enquête à MinVil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Une colonne de dossier d'enquête : le lieu du crime, puis les villageois
   dont les déclarations restent affichées sous leur nom, puis l'accusation. */
:root {
  --bg: #eceef2;
  --panel: #f9fafb;
  --ink: #1c2230;
  --muted: #586173;
  --line: #d3d8e0;
  --accent: #8f5410;
  --accent-ink: #ffffff;
  --accent-soft: #f4e7d4;
  --good: #2c6a39;
  --good-soft: #e1efe3;
  --bad: #9a2b2b;
  --bad-soft: #f6e1e1;
  --display: "Alegreya", Georgia, "Times New Roman", serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121620; --panel: #1a2030; --ink: #e5e8ee; --muted: #9aa3b4;
    --line: #2c3447; --accent: #e3a750; --accent-ink: #1a1307;
    --accent-soft: #3a2d19; --good: #86c891; --good-soft: #1d3324;
    --bad: #eb9090; --bad-soft: #3d2020; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121620; --panel: #1a2030; --ink: #e5e8ee; --muted: #9aa3b4;
  --line: #2c3447; --accent: #e3a750; --accent-ink: #1a1307;
  --accent-soft: #3a2d19; --good: #86c891; --good-soft: #1d3324;
  --bad: #eb9090; --bad-soft: #3d2020; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.55;
  padding-block: 1.5rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
h1, h2 { font-family: var(--display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); }
h2 { font-size: 1.35rem; }
p { margin: 0; }
.eyebrow {
  font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); font-variant-numeric: tabular-nums;
}
.muted { color: var(--muted); }

header { display: flex; flex-direction: column; gap: 0.5rem; }
.scene { max-width: 62ch; }

button, select, input {
  font: inherit; color: inherit;
}
button {
  cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); padding: 0.55rem 1rem; font-weight: 500;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
button:disabled { cursor: default; opacity: 0.55; }

.section { display: flex; flex-direction: column; gap: 0.75rem; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }

/* Lieu du crime */
.crime {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem 1.1rem; display: flex; flex-wrap: wrap; gap: 0.75rem 1rem;
  align-items: center; justify-content: space-between;
}
.crime p { min-width: 0; flex: 1 1 18rem; }
.clue { font-weight: 700; color: var(--accent); }

/* Villageois */
.villagers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
.villager {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
}
.villager > button {
  width: 100%; border: 0; background: transparent; border-radius: var(--radius);
  display: flex; align-items: baseline; gap: 0.75rem; padding: 0.8rem 1.1rem; text-align: left;
}
.villager > button:hover { background: var(--accent-soft); }
.villager .name { font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.villager .trade { color: var(--muted); }
.villager .state { margin-left: auto; font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.villager.asked .state { color: var(--accent); font-weight: 700; }
.quote {
  margin: 0 1.1rem 0.9rem; padding-left: 0.9rem; border-left: 3px solid var(--accent);
  font-style: italic; min-width: 0;
}
.quote .rumor { font-style: normal; font-weight: 700; }

/* Accusation */
.accuse {
  display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
}
.accuse select {
  flex: 1 1 12rem; min-width: 0; padding: 0.55rem 0.75rem; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel);
}

/* Verdict */
.verdict {
  border-radius: var(--radius); padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: 0.75rem;
  border: 1px solid var(--line);
}
.verdict.good { background: var(--good-soft); border-color: var(--good); }
.verdict.bad { background: var(--bad-soft); border-color: var(--bad); }
.verdict h2 { color: inherit; }
.verdict.good h2 { color: var(--good); }
.verdict.bad h2 { color: var(--bad); }
.verdict ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 0.4rem; }

/* Outils de test */
.tools {
  border-top: 1px solid var(--line); padding-top: 1.25rem; display: flex; flex-direction: column; gap: 1rem;
}
.replay { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.replay label { font-weight: 500; }
.replay input {
  width: 9rem; padding: 0.5rem 0.7rem; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); font-variant-numeric: tabular-nums;
}
details summary { cursor: pointer; font-weight: 500; }
details[open] summary { margin-bottom: 0.75rem; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 0.45rem 0.7rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td.lie { color: var(--bad); font-weight: 700; }
.role { font-size: 0.8rem; font-weight: 700; color: var(--accent); }
.truth-notes { display: flex; flex-direction: column; gap: 0.25rem; margin-top: 0.75rem; }
.error { color: var(--bad); }

@media (prefers-reduced-motion: no-preference) {
  .quote.new, .verdict { animation: appear 0.25s ease-out; }
  @keyframes appear { from { opacity: 0.2; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
}
</style>

<div class="page">
  <header>
    <span class="eyebrow" id="case-number">Enquête</span>
    <h1 id="title">Chargement…</h1>
    <p class="scene" id="scene"></p>
  </header>

  <section class="section" aria-labelledby="crime-head">
    <h2 id="crime-head">Lieu du crime</h2>
    <div class="crime">
      <p id="crime-text"></p>
      <button type="button" id="examine">Fouiller le lieu du crime</button>
    </div>
  </section>

  <section class="section" aria-labelledby="villagers-head">
    <div class="section-head">
      <h2 id="villagers-head">Villageois</h2>
      <span class="muted" id="progress"></span>
    </div>
    <p class="muted">Touche un villageois pour l'interroger. Sa déclaration reste notée sous son nom.</p>
    <ul class="villagers" id="villagers"></ul>
  </section>

  <section class="section" aria-labelledby="accuse-head" id="accuse-section">
    <h2 id="accuse-head">Accuser</h2>
    <div class="accuse">
      <select id="suspect" aria-label="Villageois à accuser"></select>
      <button type="button" class="primary" id="accuse">Accuser</button>
    </div>
  </section>

  <div id="verdict" aria-live="polite"></div>

  <section class="tools" aria-label="Outils de test">
    <div class="replay">
      <button type="button" id="new-case">Nouvelle enquête</button>
      <label for="seed-input">Rejouer la seed</label>
      <input id="seed-input" type="number" inputmode="numeric" step="1" placeholder="ex. 42">
      <button type="button" id="replay">Rejouer</button>
      <span class="error" id="seed-error" hidden></span>
    </div>
    <details id="truth-details">
      <summary>Mode test : afficher toute la solution</summary>
      <div id="truth"></div>
    </details>
    <p class="muted">Même seed, même crime que dans le terminal : <code>python3 -I enquete.py <span id="seed-cmd">0</span></code></p>
  </section>
</div>

<script src="mystery.js"></script>
<script>
(function () {
  "use strict";
  const M = window.Mystery;
  const $ = (id) => document.getElementById(id);

  let state = null;   // { seed, asked: [noms], clue: bool, accused: nom|null }
  let c = null;       // crime généré pour state.seed
  let lastAsked = null; // seule déclaration à animer

  function de(name) {
    return ("aeiouy".includes(name.normalize("NFD")[0].toLowerCase()) ? "d'" : "de ") + name;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  }

  function start(seed, saved) {
    c = M.generate(seed);
    state = Object.assign({ seed, asked: [], clue: false, accused: null }, saved || {});
    state.seed = seed;
    if (!saved) $("truth-details").open = false;
    try { history.replaceState(null, "", "#enquete-" + seed); } catch (e) { /* sans importance */ }
    render();
  }

  function randomSeed() { return Math.floor(Math.random() * 1000000); }

  function render() {
    const place = M.LOCATION_AT[c.crime_location];
    const done = state.accused !== null;

    $("case-number").textContent = "Enquête n° " + c.seed;
    $("title").textContent = "La mort " + de(c.victim);
    $("scene").textContent = "Ce matin, on a retrouvé le corps de " + c.victim + " " + place +
      ". Le crime a eu lieu dans la nuit. Les villageois ont tous une version de la soirée : à toi de trouver qui ment.";
    $("seed-cmd").textContent = c.seed;

    $("crime-text").innerHTML = state.clue
      ? "Près du corps, " + esc(place) + ", tu as trouvé <span class=\"clue\">" + esc(M.CLUE_VAGUE[c.clue]) +
        "</span>. Difficile de dire d'où ça vient : quelqu'un du métier saura le reconnaître. " +
        "Les villageois que tu interroges le voient désormais."
      : "Le corps a été retrouvé " + esc(place) + ". Personne n'a encore fouillé les lieux.";
    $("examine").hidden = state.clue;

    $("progress").textContent = "Interrogés : " + state.asked.length + " sur " + c.living.length;
    const list = $("villagers");
    list.innerHTML = "";
    c.living.forEach((npc) => {
      const asked = state.asked.includes(npc);
      const li = document.createElement("li");
      li.className = "villager" + (asked ? " asked" : "");
      const quote = asked ? renderQuote(npc) : "";
      li.innerHTML =
        '<button type="button" aria-expanded="' + asked + '">' +
          '<span class="name">' + esc(npc) + "</span>" +
          '<span class="trade">' + esc(c.trades[npc]) + "</span>" +
          '<span class="state">' + (asked ? "interrogé" : "interroger") + "</span>" +
        "</button>" + quote;
      li.querySelector("button").addEventListener("click", () => ask(npc));
      list.appendChild(li);
    });

    const select = $("suspect");
    const previous = select.value;
    select.innerHTML = '<option value="">Choisir un villageois…</option>' +
      c.living.map((n) => '<option value="' + esc(n) + '">' + esc(n) + " (" + esc(c.trades[n]) + ")</option>").join("");
    select.value = c.living.includes(previous) ? previous : "";
    select.disabled = done;
    $("accuse").disabled = done;
    $("examine").disabled = done;

    renderVerdict();
    renderTruth();
  }

  function renderQuote(npc) {
    const lines = M.statement(c, npc, state.clue).map((l) =>
      l.startsWith("Et puis on raconte") || l.startsWith("L'objet trouvé")
        ? '<span class="rumor">' + esc(l) + "</span>" : esc(l));
    const cls = npc === lastAsked ? "quote new" : "quote";
    return '<p class="' + cls + '">« ' + lines.join(" ") + " »</p>";
  }

  function renderVerdict() {
    const box = $("verdict");
    if (state.accused === null) { box.innerHTML = ""; box.hidden = true; return; }
    box.hidden = false;
    const right = state.accused === c.culprit;
    box.innerHTML =
      '<div class="verdict ' + (right ? "good" : "bad") + '">' +
        "<h2>" + (right
          ? "Bien vu : " + esc(c.culprit) + " avoue le crime."
          : "Raté : " + esc(state.accused) + " n'y est pour rien. Le coupable était " + esc(c.culprit) + ".") + "</h2>" +
        "<ul>" + M.explain(c).map((l) => "<li>" + esc(l) + "</li>").join("") + "</ul>" +
        '<p class="muted">Villageois interrogés : ' + state.asked.length + " sur " + c.living.length +
          (state.clue ? ". Lieu du crime fouillé." : ". Lieu du crime non fouillé.") + "</p>" +
        '<div><button type="button" class="primary" id="again">Nouvelle enquête</button></div>' +
      "</div>";
    $("again").addEventListener("click", () => start(randomSeed()));
    $("truth-details").open = true;
  }

  function renderTruth() {
    const roles = { [c.victim]: "victime", [c.culprit]: "coupable", [c.herring]: "fausse piste" };
    const rows = c.npcs.map((n) => {
      const claimed = c.alibis[n];
      const lies = claimed && claimed !== c.location_at_crime[n];
      return "<tr>" +
        "<td>" + esc(n) + (roles[n] ? ' <span class="role">' + roles[n] + "</span>" : "") + "</td>" +
        "<td>" + esc(c.trades[n]) + "</td>" +
        "<td>" + esc(c.location_at_crime[n]) + "</td>" +
        '<td class="' + (lies ? "lie" : "") + '">' + esc(claimed || "—") + "</td>" +
        "<td>" + esc((c.seen[n] || []).join(", ") || "—") + "</td>" +
        "</tr>";
    }).join("");
    const tellers = Object.keys(c.rumors).map((t) =>
      esc(t) + " révèle le motif " + esc(de(M.join(c.rumors[t]))));
    $("truth").innerHTML =
      '<div class="table-wrap"><table><thead><tr>' +
        "<th>Villageois</th><th>Métier</th><th>Position réelle</th><th>Déclaré</th><th>A vu</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<div class="truth-notes muted">' +
        "<p>Indice : " + esc(M.CLUE_VAGUE[c.clue]) + ", en fait " + esc(M.CLUE_TEXT[c.clue]) +
          " (métier : " + esc(c.clue) + " ; ressemble à : " + esc(M.clueGroup(c.clue).join(", ")) +
          "). Peut le reconnaître : " + esc(M.join(M.clueExperts(c))) + ".</p>" +
        "<p>Motifs : " + esc(c.culprit) + " (" + esc(c.motives[c.culprit]) + "), " +
          esc(c.herring) + " (" + esc(c.motives[c.herring]) + ").</p>" +
        "<p>Rumeurs : " + tellers.join(" ; ") + ".</p>" +
      "</div>";
  }

  function ask(npc) {
    if (!state.asked.includes(npc)) state.asked.push(npc);
    lastAsked = npc;
    render();
    lastAsked = null;
  }

  $("examine").addEventListener("click", () => { state.clue = true; render(); });
  $("accuse").addEventListener("click", () => {
    const who = $("suspect").value;
    if (!who) { $("suspect").focus(); return; }
    state.accused = who;
    render();
    $("verdict").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("new-case").addEventListener("click", () => start(randomSeed()));
  $("replay").addEventListener("click", () => {
    const raw = $("seed-input").value.trim();
    const err = $("seed-error");
    if (!/^\d+$/.test(raw) || !Number.isSafeInteger(Number(raw))) {
      err.textContent = "Entre un nombre entier, par exemple 42.";
      err.hidden = false;
      return;
    }
    err.hidden = true;
    start(Number(raw));
  });

  window.addEventListener("hashchange", () => {
    const m = /^#enquete-(\d+)$/.exec(location.hash);
    if (m && Number(m[1]) !== state.seed) start(Number(m[1]));
  });

  function boot(data) {
    const m = /^#enquete-(\d+)$/.exec(location.hash);
    if (data && data.state) start(data.state.seed, data.state);
    else start(m ? Number(m[1]) : randomSeed());
  }

  window.claude?.hot?.snapshot?.(() => ({ state }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
